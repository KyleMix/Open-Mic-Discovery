# Maestro smoke flow: anonymous discovery loop.
#
# Browsing needs no account: a cold start lands on Discover as a guest, in
# list view, and a listing opens with its full details. The account is
# pitched at the commitment moment (the signup footer), not at the door.
# Run: maestro test e2e/discovery.yaml (dev build with seeded local Supabase)
appId: com.openmicexplorer.app
---
- launchApp
- extendedWaitUntil:
    visible: 'Rusty Fret Open Mic.*'
    timeout: 15000
- tapOn: 'Rusty Fret Open Mic.*'
- assertVisible: 'Every Tuesday, 8:00 PM'
- assertVisible: 'Get directions'
# Signed out, the thumb-reach footer asks for an account, not the app door.
- assertVisible: 'Sign in to get on the list'
