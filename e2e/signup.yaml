# Maestro smoke flow: performer signs up for a night and withdraws.
#
# Rusty Fret opens signups 7 days ahead and closes at showtime, so on a
# seeded database its next night is always signable.
appId: com.openmicexplorer.app
---
- launchApp
- extendedWaitUntil:
    visible: 'Rusty Fret Open Mic.*'
    timeout: 15000
- tapOn: 'Rusty Fret Open Mic.*'
# Guest: the footer offers sign-in; signing in lands back on this mic
# (the auth funnel records the way back), not on the Discover tab.
- runFlow:
    when:
      visible: 'Sign in to get on the list'
    commands:
      - tapOn: 'Sign in to get on the list'
      - tapOn: 'Email'
      - inputText: 'performer@demo.openmicexplorer.local'
      - tapOn: 'Password'
      - inputText: 'demo-pass-1234'
      - tapOn: 'Sign in'
# A leftover signup from an earlier run withdraws first, so the flow is
# repeatable against the same database.
- extendedWaitUntil:
    visible: 'Sign me up|Withdraw'
    timeout: 10000
- runFlow:
    when:
      visible: 'Withdraw'
    commands:
      - tapOn: 'Withdraw'
      - tapOn: 'Yes, withdraw'
      - extendedWaitUntil:
          visible: 'Sign me up'
          timeout: 10000
# The core loop: on the list, then off it, with the state named both times.
- tapOn: 'Sign me up'
- extendedWaitUntil:
    visible: 'On the list.*'
    timeout: 10000
- tapOn: 'Withdraw'
- assertVisible: '.*gives up your spot.*'
- tapOn: 'Yes, withdraw'
- extendedWaitUntil:
    visible: 'Sign me up'
    timeout: 10000
