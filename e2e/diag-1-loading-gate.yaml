# TEMPORARY DIAGNOSTIC (remove once the e2e content failure is understood).
#
# The three real flows all time out at their first content assertion, and
# even the "Discover" tab label is absent, which looks like the app never
# getting past the pre-tabs loading gate in the CI release build rather than
# an empty Discover feed. This probe settles it: the root layout renders
# <LoadingView label="Getting things ready" /> whenever `waiting` is true
# (session not `ready`). If this flow PASSES, the app is stuck on that gate.
# Its pass/fail prints in the job log, so no screenshot artifact is needed.
appId: com.openmicexplorer.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Getting things ready'
    timeout: 12000
