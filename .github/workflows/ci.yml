name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  timezone:
    name: Unit tests under a second timezone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Several modules bucket dates with host-local getters. The suite pins
      # UTC by default, which makes runs reproducible but also hides
      # assertions that only hold in UTC. Running the same tests in a zone
      # with a negative offset and daylight saving is what catches those.
      # A failure here means a test is coupled to the machine, not that the
      # machine is wrong.
      - name: Unit tests (America/Los_Angeles)
        run: npm test
        env:
          TZ: America/Los_Angeles

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Applies every migration and the seed on the way up, so a broken
      # migration fails here before any test runs.
      - name: Start Supabase
        run: npx supabase start

      # The migrations do not enable pgTAP (it is test tooling, not schema),
      # so the suite has nothing to call plan() with until it is created.
      - name: Enable pgTAP
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -c "create extension if not exists pgtap;"

      # Diagnostics, not an assertion. supabase/tests/scheduled-jobs.test.sql
      # requires pg_cron; if this stack turns out not to ship it, this output
      # is what says so directly instead of leaving the suite failure to be
      # guessed at.
      - name: Report scheduling extension availability
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -c "select name, default_version, installed_version
                  from pg_available_extensions
                 where name in ('pg_cron', 'postgis', 'pgtap')
                 order by name;"

      - name: pgTAP suite
        run: npx supabase test db

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
