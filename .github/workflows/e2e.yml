# Maestro end-to-end flows on an Android emulator.
#
# Runs the three flows in e2e/ (discovery, signup, reviewer-coldstart)
# against a debug build talking to a local Supabase stack seeded with the
# repo seed, on PRs that touch app code.
#
# Secrets (owner setup; the workflow runs without them today):
#   MAESTRO_CLOUD_API_KEY  Optional. Set it and flip RUN_ON_MAESTRO_CLOUD
#                          to true below to upload the build and run the
#                          flows on Maestro Cloud instead of the local
#                          emulator (faster, video recordings, no KVM).
#   EXPO_TOKEN             Optional. Only needed if this workflow is later
#                          changed to pull EAS builds instead of building
#                          the debug APK with Gradle here.
# No other secrets are required: the local Supabase stack publishes its own
# anon key, which is not a secret.
name: e2e

on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/**'
      # The workflow re-runs when its own definition changes, so a fix to the
      # e2e setup is validated by the e2e run on the same PR.
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_ON_MAESTRO_CLOUD: 'false'
      # The release build runs @sentry/react-native's gradle hook, which tries
      # to upload source maps and fails in CI with "An organization ID or slug
      # is required" because no Sentry org or token is configured here (nor
      # should there be). This skips the upload while still producing the JS
      # bundle the APK needs. Real release builds upload from EAS, which has the
      # Sentry secrets.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start seeded Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Point the app at the local stack
        run: |
          STATUS=$(supabase status -o env)
          echo "$STATUS" | grep API_URL | sed 's/^API_URL=/EXPO_PUBLIC_SUPABASE_URL=/' >> "$GITHUB_ENV"
          echo "$STATUS" | grep ANON_KEY | sed 's/^ANON_KEY=/EXPO_PUBLIC_SUPABASE_ANON_KEY=/' >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prebuild the Android project
        run: npx expo prebuild --platform android --no-install

      # Release, not debug, on purpose. A debug APK loads its JS from a Metro
      # dev server at launch, and CI runs none (no `expo start`, no
      # `adb reverse tcp:8081`), so a debug build opens to the "unable to load
      # script" screen and every Maestro flow fails at its first assertion.
      # This is why e2e never passed. The release build embeds the JS bundle,
      # so the APK is self-contained; Expo's prebuild signs the release variant
      # with the debug keystore, so no signing secret is needed.
      # Skip the release lint pass (lintVitalRelease / lintVitalAnalyzeRelease).
      # assembleRelease pulls in Android's release lint, whose worker crashes on
      # the CI runner with an OutOfMemoryError (Metaspace) inside AGP's own lint
      # code, failing the build after the APK is already assembled. The e2e job
      # only needs the APK; lint is already covered by the "Typecheck, lint,
      # unit tests" job (expo lint), so there is nothing to gain by running it
      # here and everything to lose to the OOM.
      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Maestro flows on an emulator
        if: env.RUN_ON_MAESTRO_CLOUD != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # The APK was built with the local API URL (127.0.0.1:54321, from the
          # "Point the app at the local stack" step). EXPO_PUBLIC_* values are
          # inlined at build time, so a runtime env override cannot change them;
          # adb reverse routes the emulator's localhost:54321 to the host's
          # Supabase, which is what makes the baked URL reachable.
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb reverse tcp:54321 tcp:54321
            maestro test e2e/

      - name: Run the Maestro flows on Maestro Cloud
        if: env.RUN_ON_MAESTRO_CLOUD == 'true'
        run: |
          maestro cloud \
            --api-key "${{ secrets.MAESTRO_CLOUD_API_KEY }}" \
            --app-file android/app/build/outputs/apk/release/app-release.apk \
            e2e/

      - name: Upload Maestro logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-logs
          path: ~/.maestro/tests
          if-no-files-found: ignore
